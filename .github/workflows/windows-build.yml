name: Build and verify Windows x64 candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install candidate and build tools
        run: python -m pip install ".[desktop]" "PyInstaller==6.22.3" "build>=1.2"
      - name: Check native platform contracts
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_platform_support.py tests/test_runner.py
          tests/test_desktop_store.py tests/test_model_definitions.py
          tests/test_model_catalog.py tests/test_model_reasoning.py
          --junitxml=${{ runner.temp }}/windows-tests.xml
      - name: Build and verify the actual frozen executable
        run: >-
          python -X utf8 packaging/build_windows.py
          --work-root "${{ runner.temp }}/reprolab-windows-build"
          --output-dir "${{ runner.temp }}/reprolab-windows-release"
      - uses: actions/upload-artifact@v7
        with:
          name: reprolab-windows-x64-candidate
          path: ${{ runner.temp }}/reprolab-windows-release/*
          if-no-files-found: error
      - name: Retain acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-acceptance-diagnostics
          path: |
            ${{ runner.temp }}/windows-tests.xml
            ${{ runner.temp }}/reprolab-windows-build/acceptance
          if-no-files-found: ignore
          retention-days: 14
