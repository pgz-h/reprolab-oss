name: Evidence portability and isolation

on:
  workflow_dispatch:
    inputs:
      sign:
        description: Request GitHub-hosted artifact attestation
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sender:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Build and check the evidence from the installed wheel
        run: |
          mkdir -p "$RUNNER_TEMP/handoff"
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/handoff"
          python -m pip install "$RUNNER_TEMP"/handoff/*.whl
          python -I packaging/verify_install.py --output "$RUNNER_TEMP/sender"
          cp "$RUNNER_TEMP/sender/project.zip" "$RUNNER_TEMP/handoff/"
      - uses: actions/upload-artifact@v7
        with:
          name: hosted-evidence
          path: ${{ runner.temp }}/handoff/
          if-no-files-found: error
          retention-days: 14

  provenance:
    if: github.event_name == 'workflow_dispatch' && inputs.sign
    needs: sender
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: hosted-evidence
      - name: Sign the exact ZIP supplied to the receiver
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        id: sign
        with:
          subject-path: project.zip
      - uses: actions/upload-artifact@v7
        with:
          name: hosted-provenance
          path: ${{ steps.sign.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 14

  receiver:
    needs: sender
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          name: hosted-evidence
      - name: Replay without a checkout and verify the receipt
        run: |
          python -m pip install ./*.whl
          mkdir results
          reprolab project replay project.zip --confirm-run --receipt-dir results/receipt --output replays > results/replay.json
          reprolab project check-receipt project.zip results/receipt > results/checked.json
          python - <<'PY'
          import json
          from pathlib import Path
          checked = json.loads(Path('results/checked.json').read_text())
          proof = checked['replay_verification']
          assert checked['status'] == 'consistent' and proof['status'] == 'verified'
          assert proof['counts'] == {'matched': 2, 'different': 0, 'incomplete': 0}
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: hosted-receipt
          path: results/
          if-no-files-found: error
          retention-days: 14

  linux-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Probe worker access to a listener outside the network namespace
        run: |
          python -m pip install .
          sudo env REPROLAB_TEST_LINUX_NETNS=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 "$(command -v python)" -m pytest -q -p no:cacheprovider tests/test_project_audit_continuation.py::test_isolated_replay_records_kernel_denial_and_never_silently_drops_isolation

  native-filesystem:
    needs: sender
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          name: hosted-evidence
          path: ${{ runner.temp }}/received
      - name: Verify path collisions and receive a Linux evidence ZIP
        shell: bash
        run: |
          python -m pip install "$RUNNER_TEMP"/received/*.whl
          python -m pytest -q tests/test_project_audit_continuation.py::test_git_export_never_silently_merges_case_colliding_paths
          python - <<'PY'
          from pathlib import Path
          import json, os, subprocess, sys
          root = Path(os.environ['RUNNER_TEMP'])
          target = root / 'unpacked'
          result = subprocess.run([sys.executable, '-I', '-m', 'reprolab', 'project', 'unpack',
                                   root/'received/project.zip', target], text=True, capture_output=True)
          if result.returncode == 0:
              report = json.loads(result.stdout)['report_dir']
              subprocess.run([sys.executable, '-I', '-m', 'reprolab', 'project', 'check', report], check=True)
          elif os.name == 'nt' and result.returncode == 2 and not target.exists():
              assert '报告证据普通文件权限不一致' in json.loads(result.stderr)['error']['message'], result.stderr
              print('Native filesystem could not preserve the UNIX modes. Verified refusal:', result.stderr)
          else:
              raise SystemExit(result.stderr or result.stdout)
          PY

  windows-isolation:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Prepare Windows container runtime and offline dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $context = Join-Path $env:RUNNER_TEMP 'replay-image'
          New-Item -ItemType Directory -Path $context | Out-Null
          python -m pip wheel . -w "$context/wheels"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $wheel = Get-ChildItem "$context/wheels/reprolab_local*.whl"
          python -m pip install --no-index --find-links "$context/wheels" $wheel.FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          @'
          FROM python:3.14-windowsservercore-ltsc2022
          COPY wheels C:/wheels
          RUN python -m pip install --no-index --find-links C:/wheels reprolab-local
          '@ | Set-Content "$context/Dockerfile" -Encoding ascii
          docker build -t reprolab-network-probe $context
      - name: Verify offline worker, descendant and persisted evidence
        run: python -I packaging/verify_windows_network.py "${{ runner.temp }}/windows-isolation" reprolab-network-probe
      - uses: actions/upload-artifact@v7
        with:
          name: windows-network-evidence
          path: |
            ${{ runner.temp }}/windows-isolation/isolated.zip
            ${{ runner.temp }}/windows-isolation/replay.json
          if-no-files-found: error
